<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8eef0"><meta name="description" content="Numa — Persian and Gregorian calendar"><title>Numa Calendar</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="brand"><span class="brand-icon">✦</span><div><strong>نوما <span class="latin">Numa</span></strong><small>تقویمی برای لحظه‌های شما</small></div></div><button id="theme" class="icon-btn" aria-label="تغییر تم">☾</button></header><section class="intro"><span class="eyebrow">YOUR PERSONAL SPACE</span><h1>امروز، شروع یک <em>روز قشنگه.</em></h1><p id="todayLabel"></p></section><section class="calendar-card"><div class="toolbar"><div class="tabs"><button data-mode="persian" class="active">خورشیدی</button><button data-mode="gregory">میلادی</button></div><button id="today" class="soft-btn">امروز ↗</button></div><div class="month-bar"><div><span id="monthSubtitle" class="eyebrow"></span><h2 id="monthTitle"></h2></div><div class="arrows"><button id="prev" class="icon-btn" aria-label="ماه قبل">❯</button><button id="next" class="icon-btn" aria-label="ماه بعد">❮</button></div></div><div id="weekdays" class="weekdays"></div><div id="days" class="days" aria-live="polite"></div></section><section class="bottom"><div class="info"><span class="eyebrow">SELECTED DATE</span><h3 id="selectedTitle"></h3><p id="equivalent"></p></div><div class="notes"><label for="note">یادداشت این روز <span>✎</span></label><textarea id="note" placeholder="یه چیزی برای امروز بنویس..."></textarea><small>یادداشت‌ها فقط در مرورگر شما ذخیره می‌شوند.</small></div></section><footer>Made with care ✦ Numa Calendar</footer></main><script src="app.js"></script></body></html>
